# nginx reverse proxy for Healthchecks (gunicorn on 127.0.0.1:8001).
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/healthchecks
#   sudo ln -s /etc/nginx/sites-available/healthchecks /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Static files are served by WhiteNoise inside gunicorn, so no separate
# static location is strictly required. If you prefer nginx to serve the
# collected static directly, run `manage.py collectstatic` and uncomment
# the /static/ block below.

upstream healthchecks_web {
    server 127.0.0.1:8001 fail_timeout=0;
}

server {
    listen 80;
    server_name healthchecks.example.com;

    # Redirect all plain HTTP traffic to HTTPS (enable once certs exist).
    # return 301 https://$host$request_uri;

    client_max_body_size 10M;

    # location /static/ {
    #     alias /home/muhammad-ans/webapps/healthchecks/static-collected/;
    #     expires 30d;
    #     access_log off;
    # }

    location / {
        proxy_pass http://healthchecks_web;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

